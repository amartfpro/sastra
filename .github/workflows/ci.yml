# Comprobaciones en cada cambio: formato, pruebas, licencias e instalador de Windows.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pruebas:
    name: Pruebas y calidad
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Librerías de sistema para Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Dependencias de la interfaz
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Interfaz · tipos y pruebas
        working-directory: apps/desktop
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Formato del código Rust
        run: cargo fmt --all --check

      - name: Revisión del código Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas del núcleo
        run: cargo test --workspace

      - name: Licencias de las dependencias
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Dependencias de la interfaz
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Compilar el instalador
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: sastra-windows-instalador
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
