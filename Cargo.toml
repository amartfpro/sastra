[workspace]
resolver = "3"
members = [
    "crates/sastra-core",
    "crates/sastra-report",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/amartfpro/sastra"

[workspace.dependencies]
sastra-core = { path = "crates/sastra-core" }
sastra-report = { path = "crates/sastra-report" }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Optimizado como la versión final pero compila mucho más rápido; para pruebas de rendimiento.
[profile.bench-rapido]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
