# Control de licencias y dependencias con cargo-deny.
# Regla del proyecto: ninguna dependencia GPL ni AGPL, para poder elegir
# cualquier licencia al publicar Sastra (especificación, sección 7).

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]

[licenses.private]
# Los paquetes propios de Sastra no se publican en crates.io.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
